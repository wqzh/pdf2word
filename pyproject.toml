[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2word-pro"
dynamic = ["version"]
description = "Convert PDF to Word (.docx) while preserving layout: paragraphs, tables, images, side-by-side figures, headers and footers."
readme = { file = "README_EN.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wqzh" }]
keywords = [
    "pdf",
    "docx",
    "word",
    "pdf-to-word",
    "pdf-to-docx",
    "conversion",
    "layout",
    "pdfplumber",
    "python-docx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "pillow>=9.0.0",
    "pypdf>=3.0.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0"]

[project.scripts]
pdf2word-pro = "pdf2word_pro.cli:main"

[project.urls]
Homepage = "https://github.com/wqzh/pdf2word"
Repository = "https://github.com/wqzh/pdf2word"
Issues = "https://github.com/wqzh/pdf2word/issues"

[tool.setuptools.dynamic]
version = { attr = "pdf2word_pro._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf2word_pro*"]

[tool.setuptools.package-data]
pdf2word_pro = ["py.typed"]
