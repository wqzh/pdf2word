name: publish

# 发布流程：在 GitHub 上创建 Release 时自动构建并发布到 PyPI
# 首次使用前，需在 PyPI 项目页配置 Trusted Publisher：
#   Owner: wqzh   Repository: pdf2word   Workflow: publish.yml   Environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
